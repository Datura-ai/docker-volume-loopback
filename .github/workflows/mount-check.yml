name: mount-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push_tag:
        description: "build the plugin from this commit and push it to Docker Hub under this tag (e.g. 1.0.0-lium4)"
        required: true
env:
  # the published build the dind check installs; bump after a push
  PLUGIN_TAG: 1.0.0-lium6
jobs:
  direct-io-loop:
    # the same ground the lium-io e2e stand runs on: a GitHub runner kernel, the plugin's Alpine userland
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe a direct-I/O loop the way Mount does
        run: |
          uname -r; grep -c xfs /proc/filesystems || true; lsmod | grep -E "^(xfs|loop)" || true
          docker run --rm --privileged -v /dev:/dev -v "$PWD/tests:/tests" alpine:3.24 sh -c '
            set -x
            apk --no-cache add -q util-linux xfsprogs e2fsprogs file blkid
            mount --version; losetup --version
            truncate -s 512M /tmp/img
            mkfs.xfs -f -m reflink=0,rmapbt=0,bigtime=0,inobtcount=0 -i nrext64=0,exchange=0 -n parent=0 -s size=4096 /tmp/img >/dev/null && echo mkfs_ok
            file -s /tmp/img
            dev=$(losetup --direct-io=on --sector-size 4096 --nooverlap --find --show /tmp/img); echo "dev=$dev"
            losetup -l "$dev"
            again=$(losetup --direct-io=on --sector-size 4096 --nooverlap --find --show /tmp/img); echo "again=$again"
            test "$again" = "$dev" && echo nooverlap_reuses_ok || { echo nooverlap_gave_a_second_device; exit 1; }
            blkid -p "$dev" || echo "blkid_exit=$?"
            mkdir -p /mnt/t
            mount -o nouuid "$dev" /mnt/t && { echo mount_auto_ok; umount /mnt/t; } || echo "mount_auto_exit=$?"
            mount -t xfs -o nouuid "$dev" /mnt/t && { echo mount_t_xfs_ok; umount /mnt/t; } || echo "mount_t_xfs_exit=$?"
            losetup -d "$dev" || true
            dev2=$(losetup --find --show /tmp/img); blkid -p "$dev2" || echo "blkid_buffered_exit=$?"; losetup -d "$dev2"
            dmesg 2>/dev/null | tail -5 || true
          '
      - name: mount recovery tests
        run: bash tests/run-mount-recovery.sh
  plugin-inside-dind:
    # the lium-io e2e stand: the published plugin under a docker:27 dind daemon on a GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: start dind
        run: |
          docker run -d --privileged --name dind -e DOCKER_TLS_CERTDIR= docker:27.5.1-dind
          for i in $(seq 1 30); do docker exec dind docker info >/dev/null 2>&1 && break; sleep 2; done
          docker exec dind docker info --format '{{.ServerVersion}} {{.Driver}} {{.DockerRootDir}}'
      - name: install the v3 build the way the validator does and mount a 1g volume as /root
        run: |
          set -x
          docker exec dind docker plugin install daturaai/docker-volume-loopback:$PLUGIN_TAG --disable --alias vloopback:v3 --grant-all-permissions DATA_DIR=/srv/var/lib/docker/vloopback-v3 STATE_DIR=/srv/run/docker-volume-loopback-v3
          docker exec dind docker plugin set vloopback:v3 LOG_LEVEL=4
          docker exec dind docker plugin enable vloopback:v3
          docker exec dind docker volume create -d vloopback:v3 -o size=1g volume_e2e
          # the diagnostics below must still print when the mount fails; the step fails afterwards
          run_status=0
          docker exec dind docker run --rm -v volume_e2e:/root alpine:3.24 sh -c "ls -la /root; echo hello > /root/f && cat /root/f && df -T /root | tail -1" || run_status=$?
          docker exec dind sh -c 'ls -la /dev/loop* ; cat /proc/filesystems | grep -c xfs; dmesg 2>/dev/null | tail -20 || true'
          docker logs dind 2>&1 | grep -E "runCommand|Mount" | grep -E "param/|return/|err" | sed "s/.*msg=//" | cut -c1-300 | tail -30
          exit $run_status
  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    needs: [direct-io-loop]
    runs-on: ubuntu-latest
    env:
      PUSH_TAG: ${{ inputs.push_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: build the plugin rootfs and create the plugin
        run: |
          echo "$PUSH_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-lium[0-9]+$' || { echo "push_tag must look like 1.0.0-lium5"; exit 1; }
          make rootfs
          docker plugin create "daturaai/docker-volume-loopback:$PUSH_TAG" ./plugin
      - name: push
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker plugin push "daturaai/docker-volume-loopback:$PUSH_TAG"
          docker logout
      - name: manifest digest to pin in the validator
        run: |
          # an anonymous pull token for the public repository; it is used once here and never printed
          token=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:daturaai/docker-volume-loopback:pull" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          curl -sI -H "Authorization: Bearer $token" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/daturaai/docker-volume-loopback/manifests/$PUSH_TAG" | grep -i docker-content-digest
